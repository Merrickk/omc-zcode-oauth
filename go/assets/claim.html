<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>活动领取 - ZCode</title>
<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --primary: #238636;
    --primary-hover: #2ea043;
    --blue: #1f6feb;
    --blue-hover: #388bfd;
    --danger: #da3633;
    --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
    line-height: 1.5;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .badge {
    background: rgba(56, 139, 253, 0.15);
    color: #58a6ff;
    border: 1px solid rgba(56, 139, 253, 0.4);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  button {
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: #21262d;
    color: #c9d1d9;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover:not(:disabled) { background: #30363d; border-color: #8b949e; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.primary {
    background: var(--primary);
    border-color: rgba(240, 246, 252, 0.1);
    color: #fff;
  }
  button.primary:hover:not(:disabled) { background: var(--primary-hover); }

  #status-bar {
    margin-bottom: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
    word-break: break-all;
  }
  #status-bar.info { display: block; background: rgba(56, 139, 253, 0.15); color: #58a6ff; border: 1px solid rgba(56, 139, 253, 0.3); }
  #status-bar.ok { display: block; background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.3); }
  #status-bar.err { display: block; background: rgba(218, 54, 51, 0.15); color: #f85149; border: 1px solid rgba(218, 54, 51, 0.3); }
  #status-bar.warn { display: block; background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }

  #key-setup {
    background: #1c2128;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: none;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
  }
  #key-setup input {
    background: #0d1117;
    border: 1px solid var(--border);
    color: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    flex: 1;
    min-width: 200px;
  }

  .account-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .account-row {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: border-color 0.15s ease;
  }
  .account-row:hover { border-color: #8b949e; }
  .account-info {
    flex: 2;
    min-width: 0;
  }
  .account-email {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .account-file {
    font-size: 11px;
    color: var(--text-muted);
    font-family: monospace;
    font-weight: normal;
  }
  .plan-info {
    flex: 3;
    min-width: 0;
  }
  .plan-name {
    font-size: 13px;
    font-weight: 500;
    color: #58a6ff;
  }
  .plan-desc {
    font-size: 12px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .row-actions {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .claimed-tag {
    font-size: 12px;
    color: #3fb950;
    padding: 3px 8px;
    background: rgba(46, 160, 67, 0.15);
    border-radius: 4px;
    border: 1px solid rgba(46, 160, 67, 0.3);
  }
  .empty-state {
    text-align: center;
    padding: 36px;
    color: var(--text-muted);
    font-size: 14px;
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>活动领取</h1>
    <span class="badge" title="后台即使关闭此页面也会每隔 30 分钟自动巡检并领取">后台 30m 自动巡检中</span>
  </div>
  <div class="actions">
    <button id="btn-refresh-all" class="primary">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/></svg>
      刷新资格
    </button>
  </div>
</header>

<div id="key-setup">
  <span>管理密码 / Key:</span>
  <input type="password" id="custom-key" placeholder="输入 CLIProxyAPI 管理密钥">
  <button id="btn-save-key">保存</button>
</div>

<div id="status-bar"></div>

<main id="account-container" class="account-list">
  <div class="empty-state">正在加载账号并检查活动资格…</div>
</main>

<script>
(function() {
  "use strict";
  const CLAIM_API = "/v0/management/plugins/omc-zcode-oauth/claim";
  const DEFAULT_CAMPAIGN_PLAN = {
    plan_id: "zcode-v3-start-plan-wk-1120",
    name: "ZCODE WEEKEND BUILD",
    description: "GLM-5.3-Flash · 5 亿 Token"
  };

  const CPAMC_AUTH_KEY = "cli-proxy-auth";
  const CPAMC_PREFIX = "enc::v2::";
  const CPAMC_SALT = "cli-proxy-api-webui::secure-storage";

  let baseURL = location.origin;
  let managementKey = "";

  function isAsciiPrintable(str) {
    return typeof str === "string" && str.length > 0 && /^[\x20-\x7E]+$/.test(str);
  }

  // 1. Try URL parameter ?key=...
  try {
    const params = new URLSearchParams(location.search);
    const k = params.get("key");
    if (k && isAsciiPrintable(k)) managementKey = k.trim();
  } catch(_) {}

  // 2. Try localStorage manual key
  if (!managementKey) {
    try {
      const saved = localStorage.getItem("omcZcodeClaimKey");
      if (saved && isAsciiPrintable(saved)) managementKey = saved.trim();
    } catch(_) {}
  }

  // 3. Try Oh My CPA WebUI encoded credential
  if (!managementKey) {
    try {
      const raw = localStorage.getItem(CPAMC_AUTH_KEY);
      if (raw && raw.startsWith(CPAMC_PREFIX)) {
        const binary = atob(raw.slice(CPAMC_PREFIX.length));
        const key = new TextEncoder().encode(CPAMC_SALT + "|" + location.host);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i) ^ key[i % key.length];
        }
        const doc = JSON.parse(new TextDecoder().decode(bytes));
        const mk = doc && doc.state && doc.state.managementKey;
        if (isAsciiPrintable(mk)) managementKey = mk.trim();
      }
    } catch(_) {}
  }

  let accounts = [];

  function showStatus(text, type = "info", autoHide = 0) {
    const bar = document.getElementById("status-bar");
    bar.textContent = text;
    bar.className = type;
    if (autoHide > 0) setTimeout(() => { if (bar.textContent === text) bar.style.display = "none"; }, autoHide);
  }

  async function apiCall(method, path, body) {
    const headers = { "Content-Type": "application/json" };
    if (managementKey && isAsciiPrintable(managementKey)) {
      headers["Authorization"] = "Bearer " + managementKey;
    }
    const resp = await fetch(baseURL + path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined
    });
    const text = await resp.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch(_) {}
    if (!resp.ok) {
      if (resp.status === 401 || resp.status === 403) {
        document.getElementById("key-setup").style.display = "flex";
      }
      const err = (data && (data.error || data.message)) || text.slice(0, 200);
      throw new Error(`HTTP ${resp.status}: ${err}`);
    }
    return data;
  }

  function renderList() {
    const container = document.getElementById("account-container");
    if (!accounts.length) {
      container.innerHTML = '<div class="empty-state">未检索到 ZCode 账号凭据，请先在管理面板完成登录或导入。</div>';
      return;
    }
    container.innerHTML = "";
    for (const acc of accounts) {
      const row = document.createElement("div");
      row.className = "account-row";

      // 1. Account Info
      const info = document.createElement("div");
      info.className = "account-info";
      const email = document.createElement("div");
      email.className = "account-email";
      email.textContent = acc.email || acc.label || acc.name.replace(/\.json$/, "");
      const file = document.createElement("span");
      file.className = "account-file";
      file.textContent = acc.name;
      email.appendChild(file);
      info.appendChild(email);

      // 2. Plan Info
      const pinfo = document.createElement("div");
      pinfo.className = "plan-info";
      const pname = document.createElement("div");
      pname.className = "plan-name";
      const pdesc = document.createElement("div");
      pdesc.className = "plan-desc";

      const curPlan = (acc.plans && acc.plans.length) ? acc.plans[0] : null;
      if (curPlan) {
        pname.textContent = curPlan.name || curPlan.plan_id;
        const grants = (curPlan.grants && curPlan.grants.length) ? curPlan.grants.join(" · ") : (curPlan.description || "");
        pdesc.textContent = grants || "可领取赠送额度";
      } else {
        pname.textContent = DEFAULT_CAMPAIGN_PLAN.name;
        pdesc.textContent = DEFAULT_CAMPAIGN_PLAN.description + " (大促活动候选)";
      }
      pinfo.appendChild(pname);
      pinfo.appendChild(pdesc);

      // 3. Actions
      const acts = document.createElement("div");
      acts.className = "row-actions";
      if (acc.claimed) {
        const tag = document.createElement("span");
        tag.className = "claimed-tag";
        tag.textContent = "已领取";
        acts.appendChild(tag);
      } else {
        const btn = document.createElement("button");
        btn.className = "primary";
        btn.textContent = acc.busy ? "领取中…" : "领取";
        btn.disabled = acc.busy;
        btn.onclick = () => claimAccount(acc);
        acts.appendChild(btn);
      }

      row.appendChild(info);
      row.appendChild(pinfo);
      row.appendChild(acts);
      container.appendChild(row);
    }
  }

  async function loadAndRefreshAll() {
    const btn = document.getElementById("btn-refresh-all");
    btn.disabled = true;
    showStatus("正在加载账号并刷新活动资格…", "info");
    try {
      const doc = await apiCall("GET", "/v0/management/auth-files");
      const files = (doc && Array.isArray(doc.files)) ? doc.files : [];
      const zfiles = files.filter(f => {
        const p = String(f.provider || "").toLowerCase();
        const n = String(f.name || "").toLowerCase();
        return p.includes("zcode") || n.includes("zcode");
      });

      accounts = zfiles.map(f => ({
        name: f.name,
        label: f.label,
        email: f.email || f.label,
        plans: [],
        busy: false,
        claimed: false
      }));
      renderList();

      if (!accounts.length) {
        showStatus("未检索到任何 ZCode 账号凭据", "warn");
        return;
      }

      let okCount = 0;
      for (const acc of accounts) {
        try {
          const res = await apiCall("POST", `${CLAIM_API}/activate?auth=${encodeURIComponent(acc.name)}`);
          if (res && Array.isArray(res.plans) && res.plans.length) {
            acc.plans = res.plans;
            okCount++;
          }
        } catch(_) {}
        renderList();
      }
      showStatus(`资格刷新完成！共 ${accounts.length} 个账号，${okCount} 个检索到常规套餐，其余可直接点击领取。`, "ok", 5000);
    } catch(e) {
      showStatus("刷新失败: " + e.message, "err");
    } finally {
      btn.disabled = false;
    }
  }

  async function claimAccount(acc) {
    acc.busy = true;
    renderList();
    showStatus(`正在为「${acc.email || acc.name}」完成验证并领取…`, "info");
    const targetPlan = (acc.plans && acc.plans.length) ? acc.plans[0].plan_id : DEFAULT_CAMPAIGN_PLAN.plan_id;

    try {
      const res = await apiCall("POST", `${CLAIM_API}/auto`, {
        auth: acc.name,
        plan_id: targetPlan,
        activate: true
      });

      if (res && res.claimed) {
        acc.claimed = true;
        showStatus(`「${acc.email || acc.name}」领取成功！`, "ok", 4000);
      } else {
        const msg = (res && res.message) || "领取未成功";
        if (msg.includes("已经领取") || (res && res.code === "1003")) {
          acc.claimed = true;
          showStatus(`「${acc.email || acc.name}」已经领取过该套餐。`, "ok", 4000);
        } else {
          showStatus(`「${acc.email || acc.name}」: ${msg}`, "warn", 6000);
        }
      }
    } catch(e) {
      showStatus(`「${acc.email || acc.name}」领取异常: ${e.message}`, "err");
    } finally {
      acc.busy = false;
      renderList();
    }
  }

  document.getElementById("btn-refresh-all").addEventListener("click", loadAndRefreshAll);
  document.getElementById("btn-save-key").addEventListener("click", () => {
    const k = (document.getElementById("custom-key").value || "").trim();
    if (k && isAsciiPrintable(k)) {
      managementKey = k;
      localStorage.setItem("omcZcodeClaimKey", k);
      document.getElementById("key-setup").style.display = "none";
      loadAndRefreshAll();
    }
  });

  window.addEventListener("DOMContentLoaded", () => {
    loadAndRefreshAll();
  });
})();
</script>
</body>
</html>
